name: One-time audit branch formatter

on:
  push:
    branches:
      - audit/2026-10-11-execution-ci-hardening

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message == 'ci: run one-time Black formatting'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Black
        run: python -m pip install black==24.10.0
      - name: Format and regenerate module accountability
        run: |
          python -m black .
          python scripts/audit_module_accountability.py
          git add -u -- '*.py' docs/contracts/module_accountability.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format resilient execution and treasury updates'
            git push origin HEAD:refs/heads/audit/2026-10-11-execution-ci-hardening
          fi

