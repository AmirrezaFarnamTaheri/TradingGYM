name: One-time audit branch formatter

on:
  push:
    branches:
      - audit/2026-10-11-execution-ci-hardening

permissions:
  contents: write

concurrency:
  group: one-time-audit-finalizer
  cancel-in-progress: false

jobs:
  format:
    if: "github.event.head_commit.message == 'ci: finalize pinned Black and remove audit workflow'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked Black version
        run: python -m pip install black==24.10.0
      - name: Finalize formatted branch and delete temporary workflow
        shell: bash
        env:
          TARGET_BRANCH: audit/2026-10-11-execution-ci-hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git reset --hard
            git fetch --no-tags origin "$TARGET_BRANCH"
            git checkout -B finalizer-worktree FETCH_HEAD
            if [ ! -f .github/workflows/one-time-audit-formatter.yml ]; then
              echo "Formatter already finalized by a newer run"
              exit 0
            fi
            python -m black .
            python scripts/audit_module_accountability.py
            git rm -f .github/workflows/one-time-audit-formatter.yml
            git add -u -- '*.py' docs/contracts/module_accountability.json
            git commit -m "style: Black format, regenerate accountability and retire audit formatter"
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo "Finalizer successfully pushed and removed its workflow"
              exit 0
            fi
            echo "Branch advanced; retrying with a fresh source snapshot"
          done
          echo "Unable to finalize the branch after bounded retries" >&2
          exit 1

# Final branch validation request. This workflow deletes itself on success.

# Final pass includes private protocol logging and redirect-rejection tests.
