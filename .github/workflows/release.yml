name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reclaim space for the locked ML runtime
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip poetry==2.2.1
      - run: poetry install --with dev,experiments
      - run: poetry run pytest -q -m "not integration"
      - run: npm ci && npm run test:ci && npm run build
        working-directory: frontend
      - run: poetry build

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reclaim space for the candidate image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Build candidate image
        run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} --tag tradinggym:${{ github.sha }} .
      - name: Smoke installed candidate
        run: docker run --rm tradinggym:${{ github.sha }} python -m trading_gym.cli doctor
      - name: Archive exact candidate and checksum
        run: |
          mkdir -p dist
          docker save tradinggym:${{ github.sha }} | gzip -n > dist/tradinggym-${{ github.sha }}.tar.gz
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
          docker image inspect tradinggym:${{ github.sha }} > dist/image-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tradinggym-${{ github.sha }}
          path: dist/
          if-no-files-found: error
