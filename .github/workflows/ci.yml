name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly Monday-morning dependency scan (informational job below).
    - cron: "0 6 * * 1"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          # Aggressive cleanup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --only dev --no-root

      - name: Run Ruff linter
        run: poetry run ruff check .

      - name: Run Black formatter check
        run: poetry run black . --check

      - name: Run Flake8
        run: poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          # Aggressive cleanup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --only dev

      - name: Run MyPy
        run: poetry run mypy trading_gym/accounting trading_gym/production trading_gym/authz trading_gym/agent/arms trading_gym/agent/fusion.py trading_gym/agent/planner.py trading_gym/agent/autonomy_ladder.py trading_gym/agent/revision.py trading_gym/agent/budget_gate.py trading_gym/agent/working_memory.py trading_gym/agent/persistent_experience.py trading_gym/agent/experience_memory.py trading_gym/agent/strategy_variants.py trading_gym/agent/forge.py trading_gym/playground/kernel.py --ignore-missing-imports --follow-imports=silent
        # Scoped type gate: the money/authority modules plus the ADR-034/035
        # memory, forge, and kernel modules must type-check cleanly. Tree-wide
        # mypy remains advisory (65 pre-existing errors in peripheral modules)
        # until those are paid down.

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The package depends on Python 3.11+ stdlib modules (tomllib in
        # trading_gym/common/supply_chain.py, enum.StrEnum in
        # trading_gym/institutional_os/final_absorption.py), so 3.10 is outside
        # the supported floor declared in pyproject.toml.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Free Disk Space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          # Aggressive cleanup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev

      - name: Run unit tests
        run: |
          poetry run pytest -m "not integration" -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run unit tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          poetry run pytest -m "not integration" --cov=trading_gym --cov=apps --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: .

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          # Aggressive cleanup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev

      - name: Run integration tests
        run: |
          poetry run pytest -m "integration" -v --tb=short
        env:
          PYTHONPATH: .

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          # Aggressive cleanup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm run test:ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          # Aggressive cleanup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --only dev --no-root

      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r trading_gym apps -ll -ii

  dependency-scan:
    name: Dependency Scan (weekly, informational)
    runs-on: ubuntu-latest
    # Scheduled supply-chain scan: informational by design — known CVEs in
    # pinned transitive deps are tracked here weekly and triaged through
    # governance, while the *gating* security job above runs on every push.
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry pip-audit
          poetry install --only main
          poetry run pip-audit --skip-editable

      - name: npm audit (high and critical only)
        run: npm audit --audit-level=high || true
        working-directory: frontend

  kernel:
    name: Rust Kernel & Parity (ADR-035)
    runs-on: ubuntu-latest
    # The kernel is optional at runtime but its *parity with the Python
    # reference* is not: this job is the only place the bitwise comparison
    # actually executes, because the parity tests skip when no artifact
    # exists. It also holds the crate's own unit tests, clippy, and fmt.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Cargo fmt
        run: cargo fmt --check
        working-directory: rust/axiom_kernel

      - name: Clippy
        run: cargo clippy --lib -- -D warnings
        working-directory: rust/axiom_kernel

      - name: Crate unit tests
        run: cargo test --lib
        working-directory: rust/axiom_kernel

      - name: Build release cdylib
        run: cargo build --release
        working-directory: rust/axiom_kernel

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev

      - name: Parity suite against the compiled kernel
        run: poetry run pytest tests/playground/test_kernel_parity.py -v --tb=short
        env:
          PYTHONPATH: .
          AXIOM_KERNEL_PATH: rust/axiom_kernel/target/release/libaxiom_kernel.so

      - name: Playground and forge suites against the compiled kernel
        run: poetry run pytest tests/playground tests/agent tests/api/test_forge_router.py -q
        env:
          PYTHONPATH: .
          AXIOM_KERNEL_PATH: rust/axiom_kernel/target/release/libaxiom_kernel.so

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, integration, frontend, security, kernel]
    steps:
      - name: All checks passed
        run: echo "All CI checks completed successfully!"
