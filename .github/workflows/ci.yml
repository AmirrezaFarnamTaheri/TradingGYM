name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install poetry==2.2.1
      - run: poetry install --with dev
      - run: poetry run python scripts/verify_feature_fixtures.py
      - run: poetry run python scripts/verify_workflow_pins.py
      - run: poetry run pytest -q -m "not integration"
        env:
          TRADING_GYM_REQUIRE_REAL_DEPS: '1'
      - run: poetry run python scripts/export_openapi.py --check
      - run: poetry build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - run: npm audit --audit-level=high
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo test --manifest-path kernel/Cargo.toml
      - run: cargo fmt --manifest-path kernel/Cargo.toml --check
      - run: cargo build --release --manifest-path kernel/Cargo.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.2.1
      - run: poetry install --with dev
      - run: poetry run pytest tests/playground/test_kernel_parity.py tests/strategy_lab/test_adx_native_parity.py -q
