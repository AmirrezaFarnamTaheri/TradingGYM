[tool.poetry]
name = "trading-gym"
version = "32.0.0"
description = "Local autonomous trading cockpit, durable paper execution, and reinforcement-learning research."
authors = ["Your Name <you@example.com>"]
license = "AGPL-3.0-only"
packages = [{ include = "trading_gym" }]
include = [
    { path = "trading_gym/core/institutional/catalog/*.json" },
    { path = "trading_gym/market/adapters/*.json" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.2.0"
numpy = "^1.26.4"
stable-baselines3 = "^2.2.0"
gymnasium = "^0.29.1"
mlflow = "^3.6.0"
optuna = "^3.5.0"
pyyaml = "^6.0.1"
typer = {version = "^0.9.0", extras = ["rich"]}
prometheus-client = "^0.19.0"
httpx = "^0.27.0"
pyarrow = "^15.0.0"
numba = "^0.59.0"
matplotlib = "^3.8.2"
seaborn = "^0.13.2"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
torch = "^2.2.0"
requests = "^2.31.0"
abantether-python-sdk = "^0.1.4"
scipy = "^1.16.3"
mplfinance = "^0.12.10b0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
websockets = ">=12.0,<14.0"
python-multipart = "^0.0.9"
psutil = "^7.1.3"
tensorboard = "^2.20.0"
rich = "^14.2.0"
filelock = "^3.16.0"
cryptography = "^46.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
ruff = "^0.2.1"
mypy = "^1.8.0"
types-pyyaml = "^6.0.12"
types-requests = "^2.32.0"
types-setuptools = "^75.0.0"
pandas-stubs = "^2.3.2"
types-urllib3 = "^1.26.25"
flake8 = "^7.0.0"
pytest-cov = ">=6.0.0"
black = "^24.4.2"
hypothesis = ">=6.147.0,<7.0.0"

[tool.poetry.group.experiments]
optional = true

[tool.poetry.group.experiments.dependencies]
# CPU-only deployment experiments; the normal application does not require ONNX.
onnx = "1.16.2"
onnxruntime = "1.18.1"

[tool.poetry.scripts]
tgym = "trading_gym.cli:main"
tg-train = "trading_gym.rl.trainer.main:main"
tg-sim = "trading_gym.rl.simulator.main:app"
tg-paper = "trading_gym.execution.paper.main:app"

[tool.mypy]
mypy_path = "mystubs"
python_version = "3.12"
plugins = []
namespace_packages = true
ignore_missing_imports = false
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = false
exclude = ["mystubs"]

[[tool.mypy.overrides]]
module = [
    "numpy",
    "pandas",
    "pandas.*",
    "pyarrow.*",
    "pyarrow",
    "typer",
    "typer.*",
    "scipy.*",
    "prometheus_client.*",
    "mlflow",
    "mlflow.*",
    "matplotlib",
    "matplotlib.*",
    "seaborn",
    "rich",
    "rich.*",
    "stable_baselines3",
    "stable_baselines3.*",
    "numba",
    "numba.*",
    "optuna",
    "optuna.*",
    "gym",
    "gymnasium",
    "gymnasium.*",
    "abantether_python_sdk",
    "abantether_python_sdk.*",
    "tqdm",
    "tqdm.*",
    "mplfinance",
    "mplfinance.*",
    "pytest",
    "fastapi",
    "dotenv",
    "torch",
    "websockets",
    "websockets.*",
    "plyer",
    "win10toast",
    "prometheus_client",
    "hypothesis",
    "yaml",
    "pydantic",
    "fastapi.middleware.cors",
    "psutil",
    "uvicorn",
    "requests",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "trading_gym.rl.champion.runner"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "trading_gym.rl.pipelines.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "trading_gym.execution.execution_engine"
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--durations=5"
pythonpath = [".", "trading_gym"]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')"
]
