name: AxiomForge Production Evidence Gate

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Run ID containing runtime-image and repository-bound signature evidence
        required: true
        type: string
      release_artifact_name:
        description: Release evidence artifact name
        required: true
        type: string
      staging_run_id:
        description: Run ID containing staging, PostgreSQL, resilience, and game-day evidence
        required: true
        type: string
      staging_artifact_name:
        description: Staging and operations evidence artifact name
        required: true
        type: string
      venue_run_id:
        description: Run ID containing Aban E2E, WebSocket, and settlement evidence
        required: true
        type: string
      venue_artifact_name:
        description: Aban certification evidence artifact name
        required: true
        type: string
      wallet_run_id:
        description: Run ID containing Trust Wallet and WalletConnect evidence
        required: true
        type: string
      wallet_artifact_name:
        description: Wallet certification evidence artifact name
        required: true
        type: string
      chain_run_id:
        description: Run ID containing RPC quorum and transaction safety evidence
        required: true
        type: string
      chain_artifact_name:
        description: Chain certification evidence artifact name
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    environment: production-qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify dependency policy
        run: python scripts/verify_dependency_locks.py
      - name: Install exact project toolchain
        run: |
          python -m pip install "poetry==1.8.5"
          poetry check --lock
          poetry install --with dev --sync --no-interaction
      - name: Download release evidence from exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.release_artifact_name }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: build/production-evidence
      - name: Download staging and operations evidence from exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.staging_artifact_name }}
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
          path: build/production-evidence
      - name: Download Aban evidence from exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.venue_artifact_name }}
          run-id: ${{ inputs.venue_run_id }}
          github-token: ${{ github.token }}
          path: build/production-evidence
      - name: Download wallet evidence from exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.wallet_artifact_name }}
          run-id: ${{ inputs.wallet_run_id }}
          github-token: ${{ github.token }}
          path: build/production-evidence
      - name: Download chain evidence from exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.chain_artifact_name }}
          run-id: ${{ inputs.chain_run_id }}
          github-token: ${{ github.token }}
          path: build/production-evidence
      - name: Fetch exact producer run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          VENUE_RUN_ID: ${{ inputs.venue_run_id }}
          WALLET_RUN_ID: ${{ inputs.wallet_run_id }}
          CHAIN_RUN_ID: ${{ inputs.chain_run_id }}
        run: |
          set -euo pipefail
          mkdir -p build/run-metadata
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID"             > build/run-metadata/release.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID"             > build/run-metadata/staging.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VENUE_RUN_ID"             > build/run-metadata/venue.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WALLET_RUN_ID"             > build/run-metadata/wallet.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CHAIN_RUN_ID"             > build/run-metadata/chain.json
      - name: Build exact evidence provenance manifest
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          STAGING_ARTIFACT_NAME: ${{ inputs.staging_artifact_name }}
          VENUE_RUN_ID: ${{ inputs.venue_run_id }}
          VENUE_ARTIFACT_NAME: ${{ inputs.venue_artifact_name }}
          WALLET_RUN_ID: ${{ inputs.wallet_run_id }}
          WALLET_ARTIFACT_NAME: ${{ inputs.wallet_artifact_name }}
          CHAIN_RUN_ID: ${{ inputs.chain_run_id }}
          CHAIN_ARTIFACT_NAME: ${{ inputs.chain_artifact_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sources = [
              {
                  "metadata_path": "build/run-metadata/release.json",
                  "expected_run_id": int(os.environ["RELEASE_RUN_ID"]),
                  "workflow_path": ".github/workflows/release.yml",
                  "artifact_name": os.environ["RELEASE_ARTIFACT_NAME"],
                  "jobs": [2, 3],
              },
              {
                  "metadata_path": "build/run-metadata/staging.json",
                  "expected_run_id": int(os.environ["STAGING_RUN_ID"]),
                  "workflow_path": ".github/workflows/staging-qualification.yml",
                  "artifact_name": os.environ["STAGING_ARTIFACT_NAME"],
                  "jobs": [11, 13, 14, 15],
              },
              {
                  "metadata_path": "build/run-metadata/venue.json",
                  "expected_run_id": int(os.environ["VENUE_RUN_ID"]),
                  "workflow_path": ".github/workflows/aban-qualification.yml",
                  "artifact_name": os.environ["VENUE_ARTIFACT_NAME"],
                  "jobs": [16, 17, 20],
              },
              {
                  "metadata_path": "build/run-metadata/wallet.json",
                  "expected_run_id": int(os.environ["WALLET_RUN_ID"]),
                  "workflow_path": ".github/workflows/wallet-qualification.yml",
                  "artifact_name": os.environ["WALLET_ARTIFACT_NAME"],
                  "jobs": [21, 22],
              },
              {
                  "metadata_path": "build/run-metadata/chain.json",
                  "expected_run_id": int(os.environ["CHAIN_RUN_ID"]),
                  "workflow_path": ".github/workflows/chain-qualification.yml",
                  "artifact_name": os.environ["CHAIN_ARTIFACT_NAME"],
                  "jobs": [23, 24],
              },
          ]
          document = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "sources": sources,
          }
          Path("build/run-metadata/config.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          poetry run python scripts/build_evidence_provenance_manifest.py             --config build/run-metadata/config.json             --output build/production-evidence/provenance-manifest.json

      - name: Reject unexpected duplicate or missing evidence names
        run: |
          set -euo pipefail
          expected=(
            runtime-images.json release-signatures.json staging-deployment.json
            database-recovery-drill.json load-chaos-soak.json incident-game-day.json
            aban-e2e.json aban-websocket.json aban-settlement.json
            trust-wallet-extension.json walletconnect-mobile.json
            rpc-quorum.json transaction-safety.json
          )
          for name in "${expected[@]}"; do
            count="$(find build/production-evidence -type f -name "$name" | wc -l)"
            [[ "$count" == "1" ]] || { echo "expected exactly one $name, found $count" >&2; exit 2; }
            source="$(find build/production-evidence -type f -name "$name" -print -quit)"
            cp "$source" "build/production-evidence/.canonical-$name"
          done
          for name in "${expected[@]}"; do
            mv "build/production-evidence/.canonical-$name" "build/production-evidence/$name"
          done
      - name: Require every source and external qualification
        run: |
          poetry run python scripts/run_first_batch_qualification.py \
            --evidence-dir build/production-evidence \
            --provenance-manifest build/production-evidence/provenance-manifest.json \
            --output build/production-evidence/first-batch-final.json \
            --require-external
      - name: Upload immutable decision evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-evidence-decision
          path: |
            build/production-evidence/first-batch-final.json
            build/production-evidence/provenance-manifest.json
          if-no-files-found: error
          retention-days: 90
