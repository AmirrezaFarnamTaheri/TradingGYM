name: AxiomForge Chain Qualification

on:
  workflow_dispatch:
    inputs:
      chain_evidence_json:
        description: RPC quorum, simulation, gas, nonce, fee, and MEV evidence
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    environment: chain-certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AXIOMFORGE_EVIDENCE_WORKFLOW_PATH: .github/workflows/chain-qualification.yml
      AXIOMFORGE_EVIDENCE_ARTIFACT_NAME: chain-qualification-evidence
      CHAIN_EVIDENCE_JSON: ${{ inputs.chain_evidence_json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact project toolchain
        run: |
          python scripts/verify_dependency_locks.py
          python -m pip install "poetry==1.8.5"
          poetry check --lock
          poetry install --with dev --sync --no-interaction
      - name: Materialize non-secret qualification input
        run: |
          set -euo pipefail
          mkdir -p build/chain
          printf '%s' "$CHAIN_EVIDENCE_JSON" > build/chain/chain.payload.json
      - name: Evaluate chain certification evidence
        run: |
          poetry run python scripts/evaluate_rpc_quorum.py \
            --evidence build/chain/chain.payload.json \
            --output build/chain/rpc-quorum.json
          poetry run python scripts/evaluate_transaction_safety.py \
            --evidence build/chain/chain.payload.json \
            --output build/chain/transaction-safety.json
      - name: Upload chain qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chain-qualification-evidence
          path: build/chain/
          if-no-files-found: error
          retention-days: 30
