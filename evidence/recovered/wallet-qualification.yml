name: AxiomForge Wallet Qualification

on:
  workflow_dispatch:
    inputs:
      trust_wallet_extension_json:
        description: Trust Wallet extension certification evidence without secrets
        required: true
        type: string
      walletconnect_mobile_json:
        description: WalletConnect mobile certification evidence without secrets
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    environment: wallet-certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AXIOMFORGE_EVIDENCE_WORKFLOW_PATH: .github/workflows/wallet-qualification.yml
      AXIOMFORGE_EVIDENCE_ARTIFACT_NAME: wallet-qualification-evidence
      TRUST_WALLET_EXTENSION_JSON: ${{ inputs.trust_wallet_extension_json }}
      WALLETCONNECT_MOBILE_JSON: ${{ inputs.walletconnect_mobile_json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact project toolchain
        run: |
          python scripts/verify_dependency_locks.py
          python -m pip install "poetry==1.8.5"
          poetry check --lock
          poetry install --with dev --sync --no-interaction
      - name: Materialize non-secret qualification inputs
        run: |
          set -euo pipefail
          mkdir -p build/wallet
          printf '%s' "$TRUST_WALLET_EXTENSION_JSON" \
            > build/wallet/trust-wallet-extension.payload.json
          printf '%s' "$WALLETCONNECT_MOBILE_JSON" \
            > build/wallet/walletconnect-mobile.payload.json
      - name: Evaluate wallet certification evidence
        run: |
          poetry run python scripts/evaluate_wallet_certification.py \
            --extension build/wallet/trust-wallet-extension.payload.json \
            --output build/wallet/trust-wallet-extension.json
          poetry run python scripts/evaluate_wallet_certification.py \
            --walletconnect build/wallet/walletconnect-mobile.payload.json \
            --output build/wallet/walletconnect-mobile.json
      - name: Upload wallet qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wallet-qualification-evidence
          path: build/wallet/
          if-no-files-found: error
          retention-days: 30
