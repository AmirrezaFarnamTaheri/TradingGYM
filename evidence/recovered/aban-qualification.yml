name: AxiomForge Aban Qualification

on:
  workflow_dispatch:
    inputs:
      aban_evidence_json:
        description: Validated sandbox E2E evidence without credentials or secrets
        required: true
        type: string
      websocket_evidence_json:
        description: Validated Aban WebSocket integrity evidence
        required: true
        type: string
      settlement_records_json:
        description: Settlement records used for internal/external reconciliation
        required: true
        type: string
      external_net:
        description: Externally observed net settlement amount
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    environment: aban-certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AXIOMFORGE_EVIDENCE_WORKFLOW_PATH: .github/workflows/aban-qualification.yml
      AXIOMFORGE_EVIDENCE_ARTIFACT_NAME: aban-qualification-evidence
      ABAN_EVIDENCE_JSON: ${{ inputs.aban_evidence_json }}
      WEBSOCKET_EVIDENCE_JSON: ${{ inputs.websocket_evidence_json }}
      SETTLEMENT_RECORDS_JSON: ${{ inputs.settlement_records_json }}
      EXTERNAL_NET: ${{ inputs.external_net }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact project toolchain
        run: |
          python scripts/verify_dependency_locks.py
          python -m pip install "poetry==1.8.5"
          poetry check --lock
          poetry install --with dev --sync --no-interaction
      - name: Materialize non-secret qualification inputs
        run: |
          set -euo pipefail
          mkdir -p build/aban
          printf '%s' "$ABAN_EVIDENCE_JSON" > build/aban/aban.payload.json
          printf '%s' "$WEBSOCKET_EVIDENCE_JSON" > build/aban/websocket.payload.json
          printf '%s' "$SETTLEMENT_RECORDS_JSON" > build/aban/settlement-records.json
      - name: Evaluate bounded Aban certification evidence
        run: |
          poetry run python scripts/evaluate_aban_certification.py \
            --evidence build/aban/aban.payload.json \
            --output build/aban/aban-e2e.json
          poetry run python scripts/evaluate_aban_websocket.py \
            --evidence build/aban/websocket.payload.json \
            --output build/aban/aban-websocket.json
          poetry run python scripts/attest_aban_settlement.py \
            --records build/aban/settlement-records.json \
            --external-net "$EXTERNAL_NET" \
            --output build/aban/aban-settlement.json
      - name: Upload Aban qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aban-qualification-evidence
          path: build/aban/
          if-no-files-found: error
          retention-days: 30
